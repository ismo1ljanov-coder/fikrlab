<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fikrlab Mashq xonasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: phone-first app shell — sticky header, one scrolling view, bottom tab bar; the reader is a full-screen layer */
  --bg:#EDF1EF;
  --surface:#FFFFFF;
  --paper:#FAFBF9;
  --ink:#14211D;
  --muted:#5A6863;
  --line:#D3DCD8;
  --accent:#0D6B59;
  --accent-ink:#FFFFFF;
  --accent-soft:#D6EBE4;
  --good:#1D7A43;
  --warn:#A86400;
  --bad:#B0281F;
  --good-soft:#DDF0E3;
  --warn-soft:#F6E8D2;
  --bad-soft:#F7DEDB;
  --font-display:"Unbounded","Onest",system-ui,sans-serif;
  --font-ui:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-read:"Literata",Georgia,"Times New Roman",serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412; --surface:#161F1C; --paper:#131B18; --ink:#E3EBE7; --muted:#93A39D; --line:#28352F;
    --accent:#4FC3A7; --accent-ink:#06231C; --accent-soft:#16382F;
    --good:#62C98E; --warn:#E5A646; --bad:#F08A80; --good-soft:#163323; --warn-soft:#3A2A10; --bad-soft:#3D1A17;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1C; --paper:#131B18; --ink:#E3EBE7; --muted:#93A39D; --line:#28352F;
  --accent:#4FC3A7; --accent-ink:#06231C; --accent-soft:#16382F;
  --good:#62C98E; --warn:#E5A646; --bad:#F08A80; --good-soft:#163323; --warn-soft:#3A2A10; --bad-soft:#3D1A17;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font:700 18px/1.2 var(--font-display);letter-spacing:-.01em}
h2{font:600 17px/1.3 var(--font-ui)}
h3{font:600 15px/1.3 var(--font-ui)}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.app{max-width:620px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px}
.brand small{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.ok{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.ok .dot{background:var(--good)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.warn .dot{background:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.bad .dot{background:var(--bad)}
.chip.live .dot{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
main{flex:1;padding:16px 16px 96px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card.accent{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .label{font-size:12px;color:var(--muted);font-weight:500}
.tile .big{font:700 24px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.tile .big small{font:500 13px var(--font-ui);color:var(--muted);margin-left:4px}
.tile .sub{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:36px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;font-size:11.5px;font-weight:600;color:var(--muted);text-decoration:none}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--accent)}
body.focus nav.tabs, body.focus header.top{display:none}
body.focus main{padding-bottom:24px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.li:first-child{border-top:0;padding-top:0}
.li .ico{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:700 12px var(--font-display)}
.li .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.li .title{font-weight:600;overflow-wrap:anywhere}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;border-radius:99px;padding:2px 8px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.rules li::marker{color:var(--accent)}
.notice{border-radius:12px;padding:10px 12px;font-size:14px;background:var(--warn-soft);color:var(--warn)}
.notice.info{background:var(--accent-soft);color:var(--ink)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--font-ui);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
label.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
label.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
label.opt input{accent-color:var(--accent);width:18px;height:18px;flex:none}
label.opt span{overflow-wrap:anywhere}
input[type=range]{accent-color:var(--accent);width:100%}
.fileup{position:relative}
.fileup input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* reading text */
.readtext{font-family:var(--font-read);font-size:var(--fs,19px);line-height:1.65;max-width:62ch;margin:0 auto;padding:4px 2px 40px;position:relative}
.readtext p{margin:0 0 .8em}
.readtext .w{border-radius:4px;transition:background-color .08s}
.readtext .w.cur{background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.readtext .w.covered{color:transparent;background:var(--line);border-radius:2px}
.readtext.picking .w{cursor:pointer}
.readtext.picking .w:hover{background:var(--accent-soft)}
.readtext .w.picked{background:var(--accent);color:var(--accent-ink)}
.readtext .w.after{opacity:.35}
.pagecanvas{display:block;max-width:100%;margin:0 auto;border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.15)}
/* reader layer */
#reader{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column}
#reader[hidden]{display:none}
.rtop{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.rtop .t{flex:1;min-width:0;display:flex;flex-direction:column}
.rtop .t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.rtop .t span{font-size:12px;color:var(--muted)}
.rtools{display:flex;flex-direction:column;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.rtools .row{gap:8px;flex-wrap:nowrap}
.rtools .ctl{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-size:13px;color:var(--muted)}
.rtools .ctl b{color:var(--ink);min-width:62px}
#rtext{flex:1;overflow-y:auto;padding:18px 18px 0;position:relative;-webkit-overflow-scrolling:touch}
.rbottom{display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.rbottom .btn{flex:1}
#chunk{display:grid;place-items:center;min-height:55%;padding:20px;text-align:center}
#chunk .c{font:600 clamp(26px,8vw,40px)/1.3 var(--font-read);letter-spacing:.01em}
#chunk .p{margin-top:16px;font-size:13px;color:var(--muted)}
.layer{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;padding:16px}
.layer[hidden]{display:none}
.sheet{background:var(--surface);color:var(--ink);border-radius:18px;padding:20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.count{font:700 54px/1 var(--font-display);text-align:center;font-variant-numeric:tabular-nums;color:var(--accent)}
#attn{position:fixed;z-index:30;padding:12px 16px;border-radius:14px;border:2px solid var(--accent);background:var(--surface);font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.2);cursor:pointer}
#attn[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast[hidden]{display:none}
/* quiz */
.qopts{display:flex;flex-direction:column;gap:8px}
.qopts button{text-align:left;justify-content:flex-start;font-weight:500;line-height:1.35}
.qopts button.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.qopts button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.timebar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.timebar i{display:block;height:100%;background:var(--accent);width:0}
/* exercise stage */
.stage{position:relative;height:220px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.stage .fix{font:700 26px var(--font-display);color:var(--muted)}
.stage .word{font:600 30px var(--font-read);letter-spacing:.02em}
.stage .side{position:absolute;top:50%;transform:translateY(-50%);font:600 18px var(--font-read);white-space:nowrap}
.stage .cdot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.optgrid .btn{font-family:var(--font-read);font-weight:600}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.shulte{position:relative;display:grid;gap:6px;aspect-ratio:1;max-width:420px;margin:0 auto;width:100%}
.shulte .cell{border:1px solid var(--line);background:var(--paper);border-radius:10px;font:600 clamp(18px,5vw,26px) var(--font-display);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
.shulte.wait .cell{color:transparent}
.shulte .cell.done{color:var(--muted);background:var(--bg)}
.shulte .cell.err{background:var(--bad-soft);border-color:var(--bad)}
.shulte::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--accent);pointer-events:none}
.klin{position:relative;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);overflow:hidden;padding:6px 0}
.klin .kr{position:relative;height:34px}
.klin .kn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:700 12px var(--font-display);color:var(--accent)}
.klin .ks{position:absolute;top:50%;transform:translateY(-50%);font:600 17px var(--font-read)}
.sak .w{opacity:.2;transition:opacity .05s}
.sak .w.fx{opacity:1;background:var(--accent-soft)}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:9px 6px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl th{color:var(--muted);font-weight:600;border-top:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--bg)}
select,input[type=number],input[type=text]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.sizes{display:flex;gap:8px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation-duration:2s!important} }
@media (max-width:380px){ .grid2{grid-template-columns:1fr} .tile .big{font-size:22px} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>Fikrlab</h1><small>Mashq xonasi · 1–2-modul</small></div>
    <span id="todayChip" class="chip"><span class="dot"></span><span class="num">Bugun 0/20 daq</span></span>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Bo‘limlar"><div class="in">
  <a href="#bosh" data-r="bosh"><svg viewBox="0 0 24 24"><path d="M4 19V10l8-6 8 6v9h-5v-6H9v6z"/></svg>Bosh</a>
  <a href="#kitoblar" data-r="kitoblar"><svg viewBox="0 0 24 24"><path d="M4 5.5C6.5 4 9.5 4 12 6c2.5-2 5.5-2 8-.5V19c-2.5-1.5-5.5-1.5-8 .5-2.5-2-5.5-2-8-.5z"/><path d="M12 6v13.5"/></svg>Kitoblar</a>
  <a href="#mashqlar" data-r="mashqlar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Mashqlar</a>
  <a href="#test" data-r="test"><svg viewBox="0 0 24 24"><path d="M12 13l4-4"/><path d="M4.5 18a9 9 0 1 1 15 0"/></svg>Test</a>
  <a href="#ustoz" data-r="ustoz" id="tabUstoz" hidden><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.8-3.2 3.2-5 6-5s5.2 1.8 6 5"/><path d="M16 5.5a3 3 0 0 1 0 5.6M18 14c1.6.7 2.6 2.3 3 5"/></svg>Ustoz</a>
  <a href="#jurnal" data-r="jurnal"><svg viewBox="0 0 24 24"><path d="M6 3h10l3 3v15H6z"/><path d="M9 9h7M9 13h7M9 17h4"/></svg>Jurnal</a>
</div></nav>

<!-- Reader layer -->
<section id="reader" hidden aria-label="O‘qish xonasi">
  <div class="rtop">
    <button class="btn sm" id="rEnd">Yakunlash</button>
    <div class="t"><b id="rTitle">Kitob</b><span id="rPage" class="num">Bet 1 / 1</span></div>
    <span id="rChip" class="chip live"><span class="dot"></span><span class="num">00:00</span></span>
  </div>
  <div class="rtools">
    <div class="seg" role="group" aria-label="O‘qish rejimi">
      <button data-mode="normal" aria-pressed="true">Oddiy</button>
      <button data-mode="pointer" aria-pressed="false">Ko‘rsatkich</button>
      <button data-mode="shtorka" aria-pressed="false">Shtorka</button>
      <button data-mode="block" aria-pressed="false">Bloklab</button>
    </div>
    <div class="row" id="rAuto" hidden>
      <button class="btn sm primary" id="rPlay" style="min-width:92px">Boshlash</button>
      <label class="ctl" for="rWpm"><b class="num" id="rWpmV">250 s/d</b><input type="range" id="rWpm" min="100" max="900" step="25" value="250"></label>
      <div class="seg" id="rChunkSeg" role="group" aria-label="Blok hajmi" style="flex:none" hidden>
        <button data-chunk="2" aria-pressed="false">2</button><button data-chunk="3" aria-pressed="true">3</button>
      </div>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="Ovozni bosish mashqi" style="flex:1">
        <button data-metro="off" aria-pressed="true">Ritm o‘chiq</button>
        <button data-metro="ritm" aria-pressed="false">Ritm 4+2</button>
        <button data-metro="sanoq" aria-pressed="false">Sanoq 1–20</button>
      </div>
      <button class="btn sm" id="rFontM" aria-label="Harfni kichraytirish">A−</button>
      <button class="btn sm" id="rFontP" aria-label="Harfni kattalashtirish">A+</button>
    </div>
  </div>
  <div id="rtext"><div id="rbody" class="readtext"></div></div>
  <div class="rbottom">
    <button class="btn" id="rPrev">← Oldingi bet</button>
    <button class="btn primary" id="rNext">Keyingi bet →</button>
  </div>
</section>

<button id="attn" hidden>Shu yerdaman ✓</button>
<div id="layer" class="layer" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden role="status"></div>

<script>
"use strict";
/* ============ constants & helpers ============ */
const PDFJS_BASE = window.PDFJS_BASE || "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/";
const GOAL_SEC = 20 * 60;      // kunlik me’yor
const MAX_WPM = 1200;          // bundan tez varaqlangan bet hisoblanmaydi
const MIN_WORDS = 15;          // bundan kam so‘zli bet — matnsiz bet
const DAY = 86400000;

const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
if (TG) {
  try { TG.ready(); TG.expand(); document.documentElement.setAttribute("data-theme", TG.colorScheme === "dark" ? "dark" : "light"); TG.onEvent("themeChanged", () => document.documentElement.setAttribute("data-theme", TG.colorScheme === "dark" ? "dark" : "light")); } catch (e) {}
}
async function api(method, path, body) {
  let r;
  try { r = await fetch(path, { method, headers: { "Content-Type": "application/json", "X-Init-Data": TG ? TG.initData : "" }, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw { code: "network", message: "Internetga ulanib bo‘lmadi." }; }
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw { code: (j && j.code) || "http_" + r.status, message: j && j.error };
  return j;
}
/* PDF fayllarni qurilmada saqlash (IndexedDB) */
const PdfCache = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      try { const rq = indexedDB.open("fikrlab-pdf", 1); rq.onupgradeneeded = () => rq.result.createObjectStore("f"); rq.onsuccess = () => { this.db = rq.result; res(this.db); }; rq.onerror = () => rej(rq.error); }

    if (/[.!?…:»"”)]$/.test(prev) && prev.length < avg * 0.85) { paras.push(cur); cur = l; }
    else cur += " " + l;
    prev = l;
  }
  if (cur) paras.push(cur);
  return paras;
}
async function pageText(bookId, pdf, n) {
  const key = bookId + ":" + n;
  if (textCache.has(key)) return textCache.get(key);
  const p = (async () => {
    const page = await pdf.getPage(n);
    const tc = await page.getTextContent();
    const paras = buildParas(tc.items);
    const info = { paras, wordCount: wordsOf(paras.join(" ")).length };
    resolvedText.set(key, info);
    return info;
  })();
  textCache.set(key, p);
  try { return await p; } catch (e) { textCache.delete(key); throw e; }
}
async function renderPageCanvas(pdf, n, width) {
  const page = await pdf.getPage(n);
  const base = page.getViewport({ scale: 1 });
  const scale = Math.min(2.5, width / base.width) * (window.devicePixelRatio || 1);
  const vp = page.getViewport({ scale });
  const cv = document.createElement("canvas"); cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
  cv.style.width = Math.floor(vp.width / (window.devicePixelRatio || 1)) + "px";
  cv.className = "pagecanvas";
  await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
  return cv;
}
function bookIdFrom(pdf, file) {
  const fp = (pdf.fingerprints && pdf.fingerprints[0]) || (file.name + "-" + file.size);
  return "b" + String(fp).replace(/[^a-zA-Z0-9]/g, "").slice(0, 40);
}

/* local-only books need the file picked again */
function pickFileFor(book) {
  return new Promise((resolve, reject) => {
    const inp = h("input", { type: "file", accept: "application/pdf,.pdf", id: "pickAgain" });
    const sheet = openSheet([
      h("h2", { text: "Faylni qayta tanlang" }),

    ]);
    inp.addEventListener("change", async () => {

      try {

      } catch (e) { toast("PDF ochilmadi."); }
    });
  });
}
async function getPdf(book) {
  if (pdfCache.has(book.id)) return pdfCache.get(book.id);
  if (book.assetId) {
    const r = await fetch("/_blob/" + book.assetId);
    if (!r.ok) throw new Error("Fayl topilmadi");
    const pdf = await openPdfData(new Uint8Array(await r.arrayBuffer()));
    pdfCache.set(book.id, pdf); return pdf;
  }
  const cached = await PdfCache.get(book.id);
  if (cached) { try { const pdf = await openPdfData(new Uint8Array(cached)); pdfCache.set(book.id, pdf); return pdf; } catch (e) {} }
  return pickFileFor(book);
}
async function addBookFile(file) {
  if (!file) return;
  if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) { toast("Faqat PDF fayl yuklang."); return; }
  ui.busyMsg = "PDF ochilmoqda…"; render();
  try {
    const pdf = await openPdfData(new Uint8Array(await file.arrayBuffer()));
    const id = bookIdFrom(pdf, file);
    const old = Store.books.get(id);
    let title = file.name.replace(/\.pdf$/i, "");
    try { const m = await pdf.getMetadata(); const t = m && m.info && m.info.Title; if (t && String(t).trim().length > 2) title = String(t).trim(); } catch (e) {}
    let textPages = 0; const probe = Math.min(pdf.numPages, 6);
    for (let i = 1; i <= probe; i++) { const t = await pageText(id, pdf, i); if (t.wordCount >= MIN_WORDS) textPages++; }
    let assetId = old && old.assetId || null;
    if (!assetId && Store.assets) {
      if (file.size > 20 * 1024 * 1024) toast("Fayl 20 MB dan katta — faqat shu qurilmada ochiladi.", 4000);
      else { ui.busyMsg = "Kitob saqlanmoqda…"; render(); try { const r = await Store.assets.upload(file, { type: "application/pdf" }); assetId = r.id; } catch (e) { toast("Faylni bulutga saqlab bo‘lmadi (" + (e.code || "xato") + "). Shu qurilmada ishlaydi.", 4500); } }
    }
    pdfCache.set(id, pdf);
    if (!assetId) PdfCache.put(id, await file.arrayBuffer());
    Store.write("books", id, Object.assign({}, old || {}, {
      title: old ? old.title : title, numPages: pdf.numPages, assetId, scanned: textPages === 0,
      readPages: old ? old.readPages || [] : [], lastPage: old ? old.lastPage || 1 : 1,

  } catch (e) { toast("PDF ochilmadi. Fayl buzilgan yoki parolli bo‘lishi mumkin.", 4000); }
  ui.busyMsg = ""; render();
}

/* ============ Claude quiz ============ */
async function makeQuestions(text, n, images) {
  const prompt =
`Sen tez o‘qish kursi uchun tushunish testini tuzasan. Quyida o‘quvchi hozirgina o‘qigan matn (yoki sahifa rasmlari) berilgan.
Faqat shu matnda aniq aytilgan narsalar bo‘yicha ${n} ta savol tuz.
Qoidalar:
- Matnni o‘qimagan odam umumiy bilim bilan topa olmaydigan savollar bo‘lsin: voqea, ism, sabab-oqibat, raqam, asosiy fikr.
- Savollar matn bo‘ylab tarqalgan bo‘lsin (boshi, o‘rtasi, oxiri).
- Har bir savolda 4 ta qisqa variant, faqat bittasi to‘g‘ri. Tuzoq va ikki ma’noli savol bo‘lmasin.
- Til: o‘zbek tili, lotin yozuvi. Agar matn boshqa tilda bo‘lsa, savollarni matn tilida yoz.
Faqat JSON qaytar, boshqa hech narsa yozma:
{"questions":[{"q":"savol","options":["A","B","C","D"],"answer":0}]}
` + (text ? `\nMATN:\n"""\n${text.slice(0, 9000)}\n"""` : "\nMatn rasmlarda berilgan.");
  if (Store.mode === "api") {
    const imgs = [];
    for (const b of (images || [])) imgs.push(await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result)); fr.readAsDataURL(b); }));
    const r = await api("POST", "/api/quiz", { text, n, images: imgs });
    const qs = r.questions.map(q => ({ q: q.q, options: q.options.map(t => ({ t })) }));
    qs.quizId = r.quizId; return qs;
  }
  const opts = { modelTier: "quick", cache: false };
  if (images && images.length) opts.images = images;
  const res = await Store.sample.json(prompt, opts);
  const raw = Array.isArray(res) ? res : (res && Array.isArray(res.questions) ? res.questions : []);
  const qs = [];
  for (const q of raw) {
    if (!q || typeof q.q !== "string" || !Array.isArray(q.options) || q.options.length < 3) continue;
    const ans = Number(q.answer); if (!(ans >= 0 && ans < q.options.length)) continue;
    const opts2 = q.options.map((o, i) => ({ t: String(o), ok: i === ans }));
    qs.push({ q: q.q, options: shuffle(opts2) });
    if (qs.length >= n) break;
  }
  if (qs.length < Math.min(2, n)) throw { code: "bad_questions" };
  return qs;
}
function quizErrText(e) {
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled") return "Claude’ga ruxsat berilmadi, shuning uchun test tuzilmadi.";
  if (c === "rate_limited") return "Claude hozir band yoki limit tugadi. Birozdan keyin qayta urinib ko‘ring.";
  if (c === "bad_questions" || c === "invalid_json") return "Savollar to‘g‘ri tuzilmadi.";
  if (c === "no_key") return "Testlar hali yoqilmagan — ustozga ayting.";
  if (c === "network") return "Internetga ulanib bo‘lmadi.";
  return "Savollarni tayyorlab bo‘lmadi (" + (c || "xato") + ").";
}
/* Runs a quiz inside container. Resolves {n, correct} or {skipped:true, reason} */
function runQuiz(container, { text, images, n, title, allowSkip = true }) {
  return new Promise(resolve => {
    let qs = null, i = 0, correct = 0;
    const done = r => resolve(r);
    function loading() {
      container.replaceChildren(
        h("h2", { text: title }),
        h("div", { class: "row" }, h("div", { class: "spin" }), h("span", { class: "muted", text: "Claude matningiz bo‘yicha savollar tuzmoqda… (matn yopiq)" }))
      );
    }
    function err(e) {
      container.replaceChildren(
        h("h2", { text: title }),
        h("p", { class: "notice", text: quizErrText(e) }),
        h("button", { class: "btn primary", text: "Qayta urinish", onclick: start }),
        allowSkip ? h("button", { class: "btn ghost", text: "Testsiz yakunlash (tasdiqlanmaydi)", onclick: () => done({ skipped: true, reason: (e && e.code) || "error" }) }) : null
      );
    }
    async function start() {
      if (!Store.sample) { done({ skipped: true, reason: "no_sample" }); return; }
      loading();
      try { qs = await makeQuestions(text, n, images); i = 0; correct = 0; show(); }
      catch (e) { err(e); }
    }
    function show() {
      const q = qs[i];
      const box = h("div", { class: "qopts" });
      let answered = false;
      q.options.forEach((o, oi) => {
        const b = h("button", { class: "btn", text: o.t, onclick: async () => {
          if (answered) return; answered = true;
          let ok = o.ok, rightIdx = q.options.findIndex(x => x.ok);
          if (qs.quizId) {
            b.disabled = true;
            try { const r = await api("POST", "/api/quiz/" + qs.quizId + "/answer", { qi: i, choice: oi }); ok = r.right; rightIdx = r.rightIndex; }
            catch (e) { toast("Javob yuborilmadi: " + (e.message || e.code)); answered = false; b.disabled = false; return; }
            b.disabled = false;
          }
          if (ok) correct++;
          b.classList.add(ok ? "right" : "wrong");
          if (!ok) $$("button", box).forEach((bb, k) => { if (k === rightIdx) bb.classList.add("right"); });
          setTimeout(() => { i++; if (i < qs.length) show(); else finish(); }, ok ? 550 : 1200);
        } });
        box.append(b);
      });
      container.replaceChildren(
        h("div", { class: "row between" }, h("h2", { text: title }), h("span", { class: "pill num", text: (i + 1) + " / " + qs.length })),
        h("p", { style: "font-size:16px;font-weight:600", text: q.q }),
        box
      );
    }
    function finish() { done(qs.quizId ? { n: qs.length, correct, quizId: qs.quizId } : { n: qs.length, correct }); }
    start();
  });
}

/* ============ metronome ============ */
const Metro = {
  ctx: null, kind: "off", timer: null, bpm: 112, beat: 0, next: 0,
  set(kind) {
    this.stop(); this.kind = kind;
    if (kind === "off") return;
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.ctx.resume();
    } catch (e) { toast("Ovoz ishlamadi."); this.kind = "off"; return; }
    this.beat = 0; this.next = this.ctx.currentTime + 0.12;
    this.timer = setInterval(() => this.schedule(), 25);
  },
  schedule() {
    const c = this.ctx; const unit = 60 / this.bpm;
    while (this.next < c.currentTime + 0.15) {
      let accent, gap;
      if (this.kind === "ritm") { const k = this.beat % 6; accent = k === 0 || k === 4; gap = k < 4 ? unit : unit * 2; }
      else { accent = this.beat % 20 === 0; gap = unit * 1.15; }
      this.click(this.next, accent); this.next += gap; this.beat++;
    }
  },
  click(t, accent) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.frequency.value = accent ? 1250 : 820;
    g.gain.setValueAtTime(accent ? 0.5 : 0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.06);
  },
  stop() { clearInterval(this.timer); this.timer = null; }
};

function idleLimit() { const w = R.info ? R.info.wordCount : 200; return Math.min(240, Math.max(75, w / 110 * 60)); }
function autoOn() { return R.playing && R.mode !== "normal"; }
function tick() {
  if (!R.open) return;
  const now = Date.now();
  if (R.breakActive) return;
  if (document.visibilityState !== "visible") { if (!R.paused) pauseReading("Ilova yopildi yoki boshqa oynaga o‘tdingiz."); return; }
  if (R.attn) {
    R.attnPend++;
    if (now - R.attn > 20000) { hideAttn(); R.session.attnMissed++; R.attnPend = 0; pauseReading("“Shu yerdaman” tekshiruviga javob berilmadi. Oxirgi 20 soniya hisoblanmadi."); }
    updateRChip(); return;
  }
  if (R.paused) { updateRChip(); return; }
  const active = autoOn() || (now - R.lastAct) < idleLimit() * 1000;
  if (!active) { pauseReading("Uzoq vaqt hech qanday harakat bo‘lmadi."); return; }
  countSecond(1);
  if (R.since2020 >= 20 * 60) startEyeBreak();
  else if (autoOn() && R.sinceAttn >= R.nextAttn) showAttn();
  if (R.session.activeSec - R.lastSaved >= 60) saveSession();
}
function countSecond(n) {
  const s = R.session;
  s.activeSec += n; R.pageSec += n; R.since2020 += n; if (autoOn()) R.sinceAttn += n;
  s.modeSec[R.mode] = (s.modeSec[R.mode] || 0) + n;
  if (Metro.kind !== "off") s.metroSec[Metro.kind] = (s.metroSec[Metro.kind] || 0) + n;
  s.end = Date.now();
  updateRChip();
}
function updateRChip() {
  if (!R.open) return;
  const c = $("#rChip"); const sp = $("span.num", c);
  sp.textContent = clock(R.session.activeSec);
  c.className = "chip " + (R.paused || R.attn ? "warn" : "live");
  c.title = R.paused ? "Vaqt to‘xtatilgan" : "Faol vaqt hisoblanmoqda";
}
function activity() { if (R.open && !R.paused) R.lastAct = Date.now(); }
function pauseReading(reason) {
  R.paused = true; R.pauseReason = reason; stopAuto(); updateRChip();
  saveSession();

    h("p", { class: "muted small", text: "Faqat faol o‘qilgan vaqt hisoblanadi. Hozirgacha: " + clock(R.session.activeSec) + "." }),

    h("button", { class: "btn ghost", text: "O‘qishni yakunlash", onclick: () => { closeSheet(); endReading(); } })
  ]);
}

function startEyeBreak() {

async function showPage(n) {
  const tok = ++R.token;
  stopAuto(); R.pageNum = n; R.idx = 0; R.pageSec = 0; R.maxScroll = 0; R.coverFrom = 0; R.lineTop = -1;
  $("#rPage").textContent = "Bet " + n + " / " + R.pdf.numPages;
  $("#rPrev").disabled = n <= 1; $("#rNext").disabled = false;
  $("#rNext").textContent = n >= R.pdf.numPages ? "Kitob tugadi ✓" : "Keyingi bet →";
  const body = $("#rbody"); body.replaceChildren(h("div", { class: "row muted" }, h("div", { class: "spin" }), "Bet tayyorlanmoqda…"));
  $("#rtext").scrollTop = 0;
  let info;
  try { info = await pageText(R.book.id, R.pdf, n); } catch (e) { info = { paras: [], wordCount: 0 }; }
  if (tok !== R.token) return;
  R.info = info; R.wordEls = [];
  if (info.wordCount < MIN_WORDS) {
    body.replaceChildren(h("p", { class: "muted small", text: "Bu betda o‘qiladigan matn topilmadi (muqova, rasm yoki skanerlangan bet). Ko‘rsatkich rejimlari bu betda ishlamaydi." }));
    try { const cv = await renderPageCanvas(R.pdf, n, Math.min(600, $("#rtext").clientWidth - 36)); if (tok === R.token) body.append(cv); } catch (e) {}
  } else {
    const frag = document.createDocumentFragment();
    for (const para of info.paras) {

      const ws = para.split(/\s+/).filter(Boolean);
      ws.forEach((w, k) => { const s = document.createElement("span"); s.className = "w"; s.textContent = w; p.append(s); R.wordEls.push(s); if (k < ws.length - 1) p.append(" "); });
      frag.append(p);
    }
    body.replaceChildren(frag);
  }
  renderModeView();
  R.book.lastPage = n;
  Store.write("books", R.book.id, Object.assign({}, Store.books.get(R.book.id) || R.book, { lastPage: n, lastOpened: Date.now() }));
  if (n < R.pdf.numPages) pageText(R.book.id, R.pdf, n + 1).catch(() => {});

function finishPage() {
  const p = R.pageNum, words = R.info ? R.info.wordCount : 0, s = R.session;
  if (words >= MIN_WORDS && !s.pagesDone.includes(p)) {
    const wpm = words / (Math.max(R.pageSec, 1) / 60);
    if (wpm > MAX_WPM) { if (!s.pagesSkipped.includes(p)) s.pagesSkipped.push(p); toast("Bet juda tez varaqlandi — o‘qilgan deb hisoblanmadi."); }
    else {
      s.pagesDone.push(p); s.wordsRead += words;
      const sk = s.pagesSkipped.indexOf(p); if (sk >= 0) s.pagesSkipped.splice(sk, 1);
      const b = Store.books.get(R.book.id) || R.book; const rp = new Set(b.readPages || []); rp.add(p);
      Store.write("books", R.book.id, Object.assign({}, b, { readPages: Array.from(rp).sort((a, c) => a - c) }));
    }
  }
  R.pageSec = 0;
}
function nextPage(auto) {

  R.autoContinue = !!auto; showPage(R.pageNum + 1);

function prevPage() {

  toast("Ortga qaytish yozildi (regressiya).");

function barChart(days) {
  const W = 340, H = 150, L = 26, B = 22, T = 8;
  const maxMin = Math.max(30, ...days.map(d => Math.ceil(d.readSec / 60)));
  const y = m => T + (H - T - B) * (1 - m / maxMin);
  const bw = (W - L - 4) / days.length;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="So‘nggi 14 kunlik o‘qish daqiqalari">`;
  [0, 20, maxMin].forEach(v => { s += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" ${v === 20 ? 'stroke="var(--muted)" stroke-dasharray="4 3"' : 'stroke="var(--line)"'}/><text x="${L - 4}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; });
  days.forEach((d, i) => {
    const x = L + 2 + i * bw, tot = d.readSec / 60, ver = d.verSec / 60;
    if (tot > 0) {
      s += `<rect x="${x + 2}" y="${y(tot)}" width="${bw - 4}" height="${y(0) - y(tot)}" rx="3" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>`;
      if (ver > 0) s += `<rect x="${x + 2}" y="${y(ver)}" width="${bw - 4}" height="${y(0) - y(ver)}" rx="3" fill="var(--accent)"/>`;
    }

  });
  return s + "</svg>";
}
function lineChart(tests) {

  const vals = tests.flatMap(t => [t.wpm, t.effective || 0]);
  const maxV = Math.max(100, Math.ceil(Math.max(...vals) / 50) * 50);
  const x = i => tests.length === 1 ? (L + W - Rr) / 2 : L + (W - L - Rr) * i / (tests.length - 1);
  const y = v => T + (H - T - B) * (1 - v / maxV);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagnostika natijalari">`;
  [0, maxV / 2, maxV].forEach(v => { s += `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 5}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`; });
  const path = k => { let d = "", pen = false; tests.forEach((t, i) => { const v = t[k]; if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1) + " "; pen = true; }); return d.trim(); };

  return s + "</svg>";
}
